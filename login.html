<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso • Acesso</title><style>*{box-sizing:border-box}body{margin:0;background:#0d2f29;color:#12312b;font:15px 'Segoe UI',Arial;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:#f5f7f5;border-radius:18px;padding:36px;width:100%;max-width:420px}h1{margin:0;font-size:32px}small{color:#18794f;letter-spacing:2px}p{line-height:1.6;color:#61766c}label{display:block;margin-top:18px}input,button{font:inherit;width:100%;padding:13px;border:1px solid #dce5df;border-radius:8px;margin-top:7px}button{background:#18794f;color:white;margin-top:24px;font-weight:700;cursor:pointer}#error{color:#a02f24;min-height:20px}button:disabled{opacity:.6}</style><main><small>IPHONE • GESTÃO</small><h1>Pulso</h1><h2 id="title">Entrar na sua conta</h2><p id="intro">Acesse seu estoque, vendas e resultados.</p><form id="login"><label>Usuário<input name="username" required minlength="3" maxlength="100" autocomplete="username"></label><label>Senha<input name="password" type="password" required maxlength="200" autocomplete="current-password"></label><label id="activation" hidden>Código de ativação<input name="setupToken" type="password" autocomplete="off"></label><button>Entrar</button><p id="error" role="alert"></p></form></main><script>let setup=false;const form=document.querySelector('form'),button=form.querySelector('button'),error=document.getElementById('error');button.disabled=true;fetch('/api/session').then(r=>r.json()).then(s=>{if(s.authenticated){location.href='/';return}setup=s.setup;if(setup){if(s.setupTokenRequired){document.getElementById('activation').hidden=false;form.setupToken.required=true;}document.getElementById('title').textContent='Crie seu acesso';document.getElementById('intro').textContent='Primeiro acesso: escolha seu usuário e uma senha com pelo menos 10 caracteres. Guarde essa senha em local seguro.';form.password.minLength=10;form.password.autocomplete='new-password';button.textContent='Criar conta e entrar'}button.disabled=false}).catch(()=>error.textContent='Não foi possível conectar ao servidor.');form.onsubmit=async e=>{e.preventDefault();button.disabled=true;error.textContent='';try{const r=await fetch(setup?'/api/setup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const x=await r.json();if(!r.ok)throw Error(x.error);location.href='/'}catch(err){error.textContent=err.message}finally{button.disabled=false}};</script></html>
