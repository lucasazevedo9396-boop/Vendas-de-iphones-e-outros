<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso • iPhone</title>
<style>
:root{--dark:#0d2f29;--deep:#123d32;--green:#18794f;--mint:#e8f5ec;--bg:#f5f7f5;--line:#e0e7e2;--text:#12312b;--muted:#71847c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:226px;background:var(--dark);color:white;flex-shrink:0;padding:30px 18px;display:flex;flex-direction:column;gap:36px}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:34px;color:#55dba0}.brand strong{font-size:27px;line-height:1;letter-spacing:-1px}.brand small{display:block;font-size:9px;letter-spacing:2.2px;color:#c8e6d7;margin-top:8px}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;background:transparent;color:#d9ece3;padding:13px 14px;border-radius:9px}.nav button.active,.nav button:hover{background:#255344;color:white}.nav button span{display:inline-block;width:27px}.foot{margin-top:auto;color:#9ac5b4;font-size:12px}.foot b{display:block;color:white;margin-top:4px}.main{flex:1;min-width:0;padding:40px clamp(20px,3vw,48px)}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#43886a}.title{font-size:29px;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);margin:0 0 28px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:22px 0;flex-wrap:wrap}.dates{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.dates label{color:var(--muted);font-size:12px}.input{background:white;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;color:var(--text)}.btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:10px 16px;font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:hover{filter:brightness(.96)}.hero{background:linear-gradient(125deg,#123d32,#0d3029);color:white;border-radius:12px;padding:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.hero small{color:#a6d9c0}.hero h2{font-size:32px;margin:4px 0 0}.hero p{margin:2px 0;font-size:12px;color:#d6e7e1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:21px}.metric small{color:var(--muted)}.metric h2{font-size:23px;margin:14px 0 5px}.metric p{color:var(--muted);font-size:11px;margin:0}.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel h3{margin:0 0 20px;font-size:16px}.bars{display:flex;gap:10px;align-items:end;height:205px;border-bottom:1px solid var(--line);padding:15px 6px 0}.barwrap{flex:1;text-align:center;min-width:0}.bar{border-radius:5px 5px 0 0;background:#58aa85;min-height:3px}.barwrap small{font-size:10px;color:var(--muted)}.empty{color:var(--muted);padding:30px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;background:#f8faf8}.table td,.table th{padding:13px;border-bottom:1px solid var(--line)}.tag{display:inline-block;border-radius:20px;padding:4px 10px;font-size:11px;background:#eaf5ee;color:#16754c}.tag.sold{background:#eef0f1;color:#657069}.tag.reserved{background:#fff2d8;color:#936600}.filters{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0}.sectionhead h2{margin:0;font-size:20px}.modalback{position:fixed;inset:0;background:#07241eb5;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:white;padding:25px;border-radius:15px;width:min(660px,100%);max-height:95vh;overflow:auto;box-shadow:0 20px 70px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 16px}.close{border:0;background:transparent;font-size:25px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-weight:600;font-size:12px;color:#456057}.fields .input{display:block;width:100%;margin-top:5px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.notice{background:#eef8f2;border:1px solid #cbe4d4;padding:12px;border-radius:8px;color:#316c51;font-size:12px}.alert{color:#a0472b}.search{min-width:220px}.exportbox{display:flex;gap:10px;flex-wrap:wrap}.result{padding:13px 16px;background:#edf6f0;border-radius:9px;margin-top:15px;font-weight:600}@media(max-width:900px){.hero{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}.sidebar{width:100%;padding:15px;gap:12px}.brand strong{font-size:20px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.foot{display:none}.main{padding:22px 14px}.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric,.panel{padding:15px}.metric h2{font-size:19px}.fields{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">◇</div><div><strong>Pulso</strong><small>IPHONE • GESTÃO</small></div></div><nav class="nav" id="nav"><button class="active" data-page="overview"><span>▦</span> Visão geral</button><button data-page="stock"><span>▤</span> Estoque</button><button data-page="sales"><span>✦</span> Vendas</button><button data-page="clients"><span>♙</span> Clientes</button><button data-page="finance"><span>◉</span> Financeiro</button></nav><button class="btn" onclick="logout()">Sair da conta</button><div class="foot">Decisões melhores <b>começam com dados.</b></div></aside><main class="main"><div id="page"></div></main></div><div id="modalhost"></div><script>
const KEY='pulso_iphone_v1';const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';const today=()=>new Date().toLocaleDateString('en-CA');const safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let data={stock:[],sales:[],clients:[],expenses:[]};let page='overview',start='',end='',revision=0,csrf='';
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const x=await r.json();if(r.status===401){location.href='/';throw Error(x.error)}if(!r.ok)throw Error(x.error||'Falha de conexão');return x}
async function load(){const session=await request('/api/session');csrf=session.csrf;const state=await request('/api/state');data=state.data;revision=state.revision;main()}
async function save(){try{const x=await request('/api/state',{data,revision});revision=x.revision}catch(e){alert(e.message);await load();throw e}}
async function logout(){await request('/api/logout',{});location.href='/'}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const byId=id=>data.stock.find(x=>x.id===id);const salesFiltered=()=>data.sales.filter(s=>(!start||s.date>=start)&&(!end||s.date<=end));const totals=()=>{const sales=salesFiltered(),gross=sales.reduce((a,s)=>a+ +s.price,0),cost=sales.reduce((a,s)=>a+ +s.cost,0),fees=sales.reduce((a,s)=>a+ +s.fee,0),expenses=data.expenses.filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)).reduce((a,x)=>a+ +x.value,0);return {gross,cost,fees,expenses,profit:gross-cost-fees-expenses,count:sales.length}};function main(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const names={overview:['SEU NEGÓCIO EM NÚMEROS','Visão geral','Acompanhe vendas, faturamento, estoque e lucro dos seus iPhones.'],stock:['CONTROLE DE APARELHOS','Estoque','Cada iPhone com sua própria ficha e custo de aquisição.'],sales:['CONTROLE COMERCIAL','Vendas','Todas as vendas e margens em um único lugar.'],clients:['RELACIONAMENTO','Clientes','Histórico simples de compradores e contatos.'],finance:['DINHEIRO SOB CONTROLE','Financeiro','Receita, custos, taxas e despesas do negócio.']};const [eye,title,desc]=names[page];document.getElementById('page').innerHTML=`<div class="eyebrow">${eye}</div><h1 class="title">${title}</h1><p class="sub">${desc}</p><div id="body"></div>`;({overview,stock,sales,clients,finance})[page]();}
function setPage(p){page=p;main()}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function overview(){const t=totals(),available=data.stock.filter(x=>x.status==='Disponível'),capital=available.reduce((a,x)=>a+ +x.cost,0),v=salesFiltered();let days={};for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days[d.toLocaleDateString('en-CA')]=0}v.forEach(x=>{if(Object.hasOwn(days,x.date))days[x.date]+= +x.price});let max=Math.max(1,...Object.values(days));let counts={};v.forEach(x=>counts[x.model]=(counts[x.model]||0)+1);const tops=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);document.getElementById('body').innerHTML=`<div class="toolbar"><div class="dates"><label>De</label><input class="input" type="date" id="from" value="${start}"><label>Até</label><input class="input" type="date" id="to" value="${end}"><button class="btn" onclick="applyFilter()">Aplicar</button><button class="btn" onclick="clearFilter()">Limpar</button></div><button class="btn primary" onclick="saleModal()">＋ Nova venda</button></div><section class="hero"><div><small>LUCRO LÍQUIDO ESTIMADO</small><h2>${money(t.profit)}</h2><p>Vendas − custos − taxas − despesas</p></div><div><small>CUSTO DOS IPHONES VENDIDOS</small><h2>${money(t.cost)}</h2><p>Aparelhos vendidos no período</p></div><div><small>TAXAS + DESPESAS</small><h2>${money(t.fees+t.expenses)}</h2><p>Custos extras registrados</p></div></section><section class="metrics"><div class="metric"><small>Faturamento</small><h2>${money(t.gross)}</h2><p>Receita de vendas</p></div><div class="metric"><small>iPhones vendidos</small><h2>${t.count}</h2><p>No período selecionado</p></div><div class="metric"><small>Em estoque</small><h2>${available.length}</h2><p>${money(capital)} investidos</p></div><div class="metric"><small>Ticket médio</small><h2>${money(t.count?t.gross/t.count:0)}</h2><p>Por iPhone vendido</p></div></section><section class="twocol"><div class="panel"><h3>Faturamento • últimos 7 dias</h3><div class="bars">${Object.entries(days).map(([d,v])=>`<div class="barwrap" title="${dateFmt(d)}: ${money(v)}"><div class="bar" style="height:${Math.max(3,v/max*170)}px"></div><small>${d.slice(8)}</small></div>`).join('')}</div></div><div class="panel"><h3>Top modelos vendidos</h3>${tops.length?tops.map(([k,n],i)=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0"><span>${String(i+1).padStart(2,'0')} &nbsp; ${safe(k)}</span><b>${n} un.</b></p>`).join(''):'<p class="empty">Registre sua primeira venda para ver os modelos mais vendidos.</p>'}</div></section><p class="sub" style="margin-top:17px;font-size:12px">Dados salvos no servidor. Exporte backups regularmente.</p>`}
function applyFilter(){if(document.getElementById('from').value&&document.getElementById('to').value&&document.getElementById('from').value>document.getElementById('to').value){alert('A data inicial deve ser anterior à final.');return}start=document.getElementById('from').value;end=document.getElementById('to').value;overview()}function clearFilter(){start='';end='';overview()}
function stock(){document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${data.stock.length} aparelhos cadastrados</h2><button class="btn primary" onclick="stockModal()">＋ Cadastrar iPhone</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Modelo</th><th>Capacidade</th><th>Bateria</th><th>IMEI / Identificação</th><th>Custo</th><th>Preço anunciado</th><th>Status</th><th>Ação</th></tr></thead><tbody>${data.stock.map(s=>`<tr><td><b>${safe(s.model)}</b><br><small>${safe(s.color)}</small></td><td>${safe(s.storage)}</td><td>${s.battery?s.battery+'%':'—'}</td><td>${safe(s.imei||'—')}</td><td>${money(s.cost)}</td><td>${money(s.ask)}</td><td><span class="tag ${s.status==='Vendido'?'sold':s.status==='Reservado'?'reserved':''}">${s.status}</span></td><td>${s.status==='Disponível'?`<button class="btn" onclick="saleModal('${s.id}')">Vender</button>`:`<button class="btn" onclick="toggleReserve('${s.id}')">${s.status==='Reservado'?'Liberar':'Detalhes'}</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum iPhone cadastrado. Comece pelo botão “Cadastrar iPhone”.</td></tr>'}</tbody></table></div>`}
async function toggleReserve(id){let s=byId(id);if(s.status==='Reservado'){s.status='Disponível';await save();stock()}else alert('Este aparelho já foi vendido. Consulte a aba Vendas.')}
function sales(){document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${data.sales.length} vendas registradas</h2><button class="btn primary" onclick="saleModal()">＋ Registrar venda</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data</th><th>iPhone</th><th>Cliente</th><th>Valor</th><th>Custo</th><th>Taxa</th><th>Lucro da venda</th><th>Pagamento</th><th>A receber</th><th>Garantia</th><th>Ação</th></tr></thead><tbody>${[...data.sales].reverse().map(s=>`<tr><td>${dateFmt(s.date)}</td><td><b>${safe(s.model)}</b></td><td>${safe(s.client)}</td><td>${money(s.price)}</td><td>${money(s.cost)}</td><td>${money(s.fee)}</td><td><b>${money(s.price-s.cost-s.fee)}</b></td><td>${safe(s.payment)}</td><td>${money(s.price-(s.received??s.price))}</td><td>${safe(s.warranty||'—')}</td><td>${s.price>(s.received??s.price)?`<button class="btn" onclick="receiveModal('${s.id}')">Receber</button>`:'Quitado'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma venda ainda.</td></tr>'}</tbody></table></div>`}
function receiveModal(id){const sale=data.sales.find(x=>x.id===id),pending=sale.price-(sale.received??sale.price);modal('Registrar recebimento',num('amount','Valor recebido (R$)'),async f=>{const amount=+f.get('amount');if(amount<=0||amount>pending){alert('Informe um valor maior que zero e até '+money(pending));return}sale.received=(sale.received??sale.price)+amount;await save();closeModal();main()})}
function clients(){let list=[...data.clients];document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${list.length} clientes</h2><button class="btn primary" onclick="clientModal()">＋ Novo cliente</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Compras registradas</th><th>Total comprado</th></tr></thead><tbody>${list.map(c=>{let s=data.sales.filter(x=>x.clientId===c.id);return `<tr><td><b>${safe(c.name)}</b></td><td>${safe(c.phone)}</td><td>${s.length}</td><td>${money(s.reduce((a,x)=>a+ +x.price,0))}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Os compradores cadastrados aparecem aqui.</td></tr>'}</tbody></table></div>`}
function finance(){let t=totals();document.getElementById('body').innerHTML=`<section class="metrics"><div class="metric"><small>Receita total</small><h2>${money(t.gross)}</h2></div><div class="metric"><small>Custo dos aparelhos</small><h2>${money(t.cost)}</h2></div><div class="metric"><small>Taxas + despesas</small><h2>${money(t.fees+t.expenses)}</h2></div><div class="metric"><small>Lucro estimado</small><h2>${money(t.profit)}</h2></div></section><div class="notice">A receber: <b>${money(data.sales.reduce((a,s)=>a+s.price-(s.received??s.price),0))}</b> · O lucro é calculado pelas vendas, independentemente da data de recebimento.</div><div class="sectionhead"><h2>Despesas adicionais</h2><button class="btn primary" onclick="expenseModal()">＋ Adicionar despesa</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${[...data.expenses].reverse().map(e=>`<tr><td>${dateFmt(e.date)}</td><td>${safe(e.desc)}</td><td>${money(e.value)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhuma despesa adicional cadastrada.</td></tr>'}</tbody></table></div><div class="sectionhead"><h2>Seus dados</h2></div><div class="panel"><p class="sub">Os registros ficam no banco de dados do servidor. Exporte backups para guardar uma cópia independente.</p><div class="exportbox"><button class="btn" onclick="exportData()">↓ Exportar backup JSON</button><label class="btn">↑ Importar backup<input style="display:none" type="file" accept="application/json" onchange="importData(event)"></label></div></div>`}
function modal(title,fields,onSubmit,extra=''){document.getElementById('modalhost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form id="entryForm"><div class="fields">${fields}</div>${extra}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>`;document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{await onSubmit(new FormData(e.target))}catch(err){console.error('Operação não concluída')}finally{btn.disabled=false}}}const inp=(name,label,type='text',req=true,value='',extra='')=>`<label>${label}<input class="input" name="${name}" type="${type}" ${req?'required':''} value="${safe(value)}" ${extra}></label>`;const sel=(name,label,opts)=>`<label>${label}<select class="input" name="${name}">${opts.map(v=>`<option value="${safe(v)}">${safe(v)}</option>`).join('')}</select></label>`;const num=(n,l,req=true)=>inp(n,l,'number',req,'','min="0" step="0.01"');function closeModal(){document.getElementById('modalhost').innerHTML=''}
function stockModal(){modal('Cadastrar iPhone',inp('model','Modelo (ex.: iPhone 13)', 'text')+inp('storage','Armazenamento (ex.: 128GB)')+inp('color','Cor', 'text',false)+inp('battery','Saúde da bateria (%)','number',false,'','min="0" max="100"')+inp('imei','IMEI ou identificação','text',false)+sel('condition','Condição',['Seminovo','Novo','Vitrine'])+num('cost','Preço de compra (R$)')+num('ask','Preço anunciado (R$)')+inp('supplier','Fornecedor','text',false)+inp('entryDate','Data de entrada','date',true,today())+inp('notes','Observações','text',false)+sel('status','Status',['Disponível','Reservado']),async f=>{let s=Object.fromEntries(f);if(s.imei&&data.stock.some(x=>x.imei===s.imei)){alert('IMEI já cadastrado.');return}data.stock.push({...s,id:uid(),cost:+s.cost,ask:+s.ask,battery:s.battery?+s.battery:null});await save();closeModal();main()},'<p class="notice">Cadastre cada aparelho separadamente, mesmo quando forem do mesmo modelo.</p>')}
function clientModal(){modal('Cadastrar cliente',inp('name','Nome completo')+inp('phone','Telefone / WhatsApp','tel',false),async f=>{const c=Object.fromEntries(f);data.clients.push({...c,id:uid()});await save();closeModal();main()})}
function salePreview(){const item=byId(document.getElementById("sellStock").value);if(item)document.querySelector('[name="price"]').value=item.ask}
function saleModal(selected=''){let items=data.stock.filter(s=>s.status==='Disponível');if(!items.length){alert('Cadastre um iPhone disponível no Estoque antes de registrar uma venda.');setPage('stock');return}let html=`<label class="full">iPhone vendido<select name="stockId" id="sellStock" class="input" onchange="salePreview()">${items.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${safe(s.model)} • ${safe(s.storage)} • ${safe(s.imei||s.color)} • custo ${money(s.cost)}</option>`).join('')}</select></label><label class="full">Cliente<select name="clientId" class="input">${data.clients.map(c=>`<option value="${c.id}">${safe(c.name)}</option>`).join('')}<option value="__new" ${!data.clients.length?'selected':''}>＋ Cadastrar comprador nesta venda</option></select></label>`+inp('newName','Nome do comprador (necessário se escolher cadastrar)','text',false)+inp('newPhone','Telefone do comprador','tel',false)+inp('date','Data da venda','date',true,today())+num('price','Valor vendido (R$)')+num('fee','Taxa da maquininha / plataforma (R$)',false)+num('received','Valor já recebido (R$, deixe vazio para pagamento integral)',false)+inp('warranty','Garantia (ex.: 90 dias)','text',false)+inp('notes','Observações','text',false)+sel('payment','Pagamento',['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Outro']);modal('Registrar venda',html,async f=>{let v=Object.fromEntries(f);if(v.received!==''&&+v.received>+v.price){alert('O valor recebido não pode superar o valor da venda.');return}const item=byId(v.stockId);if(!item||item.status!=='Disponível'){alert('Este aparelho não está mais disponível.');return}if(v.clientId==='__new'){if(!v.newName.trim()){alert('Informe o nome do comprador.');return}let c={id:uid(),name:v.newName.trim(),phone:v.newPhone||''};data.clients.push(c);v.clientId=c.id}let c=data.clients.find(x=>x.id===v.clientId);data.sales.push({id:uid(),stockId:item.id,model:item.model+' '+item.storage,clientId:c.id,client:c.name,date:v.date,price:+v.price,cost:+item.cost,fee:+v.fee||0,payment:v.payment,received:v.received===''?+v.price:+v.received,warranty:v.warranty,notes:v.notes});item.status='Vendido';await save();closeModal();setPage('sales')},'<p class="notice">O custo vem automaticamente do aparelho cadastrado no estoque. O lucro da venda será o valor recebido menos o custo e a taxa informada.</p>')}
function expenseModal(){modal('Adicionar despesa',inp('date','Data','date',true,today())+inp('desc','Descrição')+num('value','Valor (R$)'),async f=>{let x=Object.fromEntries(f);data.expenses.push({...x,id:uid(),value:+x.value});await save();closeModal();finance()})}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-pulso-iphone-'+today()+'.json';a.click();URL.revokeObjectURL(url)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=async()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.stock)||!Array.isArray(x.sales)||!Array.isArray(x.clients)||!Array.isArray(x.expenses))throw Error('formato');if(!confirm('Substituir todos os dados atuais pelo backup importado?'))return;data={stock:x.stock,sales:x.sales,clients:x.clients,expenses:x.expenses};await save();main();alert('Backup importado.')}catch(err){alert('Arquivo inválido.')}};reader.readAsText(f)}load().catch(e=>alert(e.message));
