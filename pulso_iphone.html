</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">◇</div><div><strong>Pulso</strong><small>IPHONE • GESTÃO</small></div></div><nav class="nav" id="nav"><button class="active" data-page="overview"><span>▦</span> Visão geral</button><button data-page="stock"><span>▤</span> Estoque</button><button data-page="sales"><span>✦</span> Vendas</button><button data-page="clients"><span>♙</span> Clientes</button><button data-page="finance"><span>◉</span> Financeiro</button></nav><button class="btn" onclick="logout()">Sair da conta</button><div class="foot">Decisões melhores <b>começam com dados.</b></div></aside><main class="main"><div id="page"></div></main></div><div id="modalhost"></div><script>
const KEY='pulso_iphone_v1';const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';const today=()=>new Date().toLocaleDateString('en-CA');const safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let data={stock:[],sales:[],clients:[],expenses:[]};let page='overview',start='',end='',revision=0,csrf='',rates={};
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const x=await r.json();if(r.status===401){location.href='/';throw Error(x.error)}if(!r.ok)throw Error(x.error||'Falha de conexão');return x}
async function load(){rates=await request('/api/rates');const session=await request('/api/session');csrf=session.csrf;const state=await request('/api/state');data=state.data;revision=state.revision;main()}
async function save(){try{const x=await request('/api/state',{data,revision});revision=x.revision}catch(e){alert(e.message);await load();throw e}}
async function logout(){await request('/api/logout',{});location.href='/'}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const byId=id=>data.stock.find(x=>x.id===id);const salesFiltered=()=>data.sales.filter(s=>(!start||s.date>=start)&&(!end||s.date<=end));const totals=()=>{const sales=salesFiltered(),gross=sales.reduce((a,s)=>a+ +s.price,0),cost=sales.reduce((a,s)=>a+ +s.cost,0),fees=sales.reduce((a,s)=>a+ +s.fee,0),expenses=data.expenses.filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)).reduce((a,x)=>a+ +x.value,0);return {gross,cost,fees,expenses,profit:gross-cost-fees-expenses,count:sales.length}};function main(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const names={overview:['SEU NEGÓCIO EM NÚMEROS','Visão geral','Acompanhe vendas, faturamento, estoque e lucro dos seus iPhones.'],stock:['CONTROLE DE APARELHOS','Estoque','Cada iPhone com sua própria ficha e custo de aquisição.'],sales:['CONTROLE COMERCIAL','Vendas','Todas as vendas e margens em um único lugar.'],clients:['RELACIONAMENTO','Clientes','Histórico simples de compradores e contatos.'],finance:['DINHEIRO SOB CONTROLE','Financeiro','Receita, custos, taxas e despesas do negócio.']};const [eye,title,desc]=names[page];document.getElementById('page').innerHTML=`<div class="eyebrow">${eye}</div><h1 class="title">${title}</h1><p class="sub">${desc}</p><div id="body"></div>`;({overview,stock,sales,clients,finance})[page]();}
function setPage(p){page=p;main()}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function overview(){const t=totals(),available=data.stock.filter(x=>x.status==='Disponível'),capital=available.reduce((a,x)=>a+ +x.cost,0),v=salesFiltered();let days={};for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days[d.toLocaleDateString('en-CA')]=0}v.forEach(x=>{if(Object.hasOwn(days,x.date))days[x.date]+= +x.price});let max=Math.max(1,...Object.values(days));let counts={};v.forEach(x=>counts[x.model]=(counts[x.model]||0)+1);const tops=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);document.getElementById('body').innerHTML=`<div class="toolbar"><div class="dates"><label>De</label><input class="input" type="date" id="from" value="${start}"><label>Até</label><input class="input" type="date" id="to" value="${end}"><button class="btn" onclick="applyFilter()">Aplicar</button><button class="btn" onclick="clearFilter()">Limpar</button></div><button class="btn primary" onclick="saleModal()">＋ Nova venda</button></div><section class="hero"><div><small>LUCRO LÍQUIDO ESTIMADO</small><h2>${money(t.profit)}</h2><p>Vendas − custos − taxas − despesas</p></div><div><small>CUSTO DOS IPHONES VENDIDOS</small><h2>${money(t.cost)}</h2><p>Aparelhos vendidos no período</p></div><div><small>TAXAS + DESPESAS</small><h2>${money(t.fees+t.expenses)}</h2><p>Custos extras registrados</p></div></section><section class="metrics"><div class="metric"><small>Faturamento</small><h2>${money(t.gross)}</h2><p>Receita de vendas</p></div><div class="metric"><small>iPhones vendidos</small><h2>${t.count}</h2><p>No período selecionado</p></div><div class="metric"><small>Em estoque</small><h2>${available.length}</h2><p>${money(capital)} investidos</p></div><div class="metric"><small>Ticket médio</small><h2>${money(t.count?t.gross/t.count:0)}</h2><p>Por iPhone vendido</p></div></section><section class="twocol"><div class="panel"><h3>Faturamento • últimos 7 dias</h3><div class="bars">${Object.entries(days).map(([d,v])=>`<div class="barwrap" title="${dateFmt(d)}: ${money(v)}"><div class="bar" style="height:${Math.max(3,v/max*170)}px"></div><small>${d.slice(8)}</small></div>`).join('')}</div></div><div class="panel"><h3>Top modelos vendidos</h3>${tops.length?tops.map(([k,n],i)=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0"><span>${String(i+1).padStart(2,'0')} &nbsp; ${safe(k)}</span><b>${n} un.</b></p>`).join(''):'<p class="empty">Registre sua primeira venda para ver os modelos mais vendidos.</p>'}</div></section><p class="sub" style="margin-top:17px;font-size:12px">Dados salvos no servidor. Exporte backups regularmente.</p>`}
function applyFilter(){if(document.getElementById('from').value&&document.getElementById('to').value&&document.getElementById('from').value>document.getElementById('to').value){alert('A data inicial deve ser anterior à final.');return}start=document.getElementById('from').value;end=document.getElementById('to').value;overview()}function clearFilter(){start='';end='';overview()}
function stock(){document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${data.stock.length} aparelhos cadastrados</h2><button class="btn primary" onclick="stockModal()">＋ Cadastrar iPhone</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Modelo</th><th>Capacidade</th><th>Bateria</th><th>IMEI / Identificação</th><th>Custo</th><th>Preço anunciado</th><th>Status</th><th>Ação</th></tr></thead><tbody>${data.stock.map(s=>`<tr><td><b>${safe(s.model)}</b><br><small>${safe(s.color)}</small></td><td>${safe(s.storage)}</td><td>${s.battery!=null&&s.battery!==''?s.battery+'%':'—'}</td><td>${safe(s.imei||'—')}</td><td>${money(s.cost)}</td><td>${money(s.ask)}</td><td><span class="tag ${s.status==='Vendido'?'sold':s.status==='Reservado'?'reserved':''}">${s.status}</span></td><td><button class="btn" onclick="stockModal('${s.id}')">Editar</button> ${s.status==='Disponível'?`<button class="btn" onclick="saleModal('${s.id}')">Vender</button>`:`<button class="btn" onclick="toggleReserve('${s.id}')">${s.status==='Reservado'?'Liberar':'Detalhes'}</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum iPhone cadastrado. Comece pelo botão “Cadastrar iPhone”.</td></tr>'}</tbody></table></div>`}
async function toggleReserve(id){let s=byId(id);if(s.status==='Reservado'){s.status='Disponível';await save();stock()}else alert('Este aparelho já foi vendido. Consulte a aba Vendas.')}
function sales(){document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${data.sales.length} vendas registradas</h2><button class="btn primary" onclick="saleModal()">＋ Registrar venda</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data</th><th>iPhone</th><th>Cliente</th><th>Valor</th><th>Custo</th><th>Taxa</th><th>Lucro da venda</th><th>Pagamento</th><th>A receber</th><th>Garantia</th><th>Ação</th></tr></thead><tbody>${[...data.sales].reverse().map(s=>`<tr><td>${dateFmt(s.date)}</td><td><b>${safe(s.model)}</b></td><td>${safe(s.client)}</td><td>${money(s.price)}</td><td>${money(s.cost)}</td><td>${money(s.fee)}</td><td><b>${money(s.price-s.cost-s.fee)}</b></td><td>${safe(s.payment)}${s.cardBrand?'<br><small>'+safe(s.cardBrand)+' · '+(s.installments||1)+'x</small>':''}</td><td>${money(s.price-(s.received??s.price))}</td><td>${safe(s.warranty||'—')}</td><td><button class="btn" onclick="saleModal('', '${s.id}')">Editar</button> ${s.price>(s.received??s.price)?`<button class="btn" onclick="receiveModal('${s.id}')">Receber</button>`:'Quitado'}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">Nenhuma venda ainda.</td></tr>'}</tbody></table></div>`}
function receiveModal(id){const sale=data.sales.find(x=>x.id===id),pending=sale.price-(sale.received??sale.price);modal('Registrar recebimento',num('amount','Valor recebido (R$)'),async f=>{const amount=+f.get('amount');if(amount<=0||amount>pending){alert('Informe um valor maior que zero e até '+money(pending));return}sale.received=(sale.received??sale.price)+amount;await save();closeModal();main()})}
function clients(){let list=[...data.clients];document.getElementById('body').innerHTML=`<div class="sectionhead"><h2>${list.length} clientes</h2><button class="btn primary" onclick="clientModal()">＋ Novo cliente</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Compras registradas</th><th>Total comprado</th><th>Ação</th></tr></thead><tbody>${list.map(c=>{let s=data.sales.filter(x=>x.clientId===c.id);return `<tr><td><b>${safe(c.name)}</b></td><td>${safe(c.phone)}</td><td>${s.length}</td><td>${money(s.reduce((a,x)=>a+ +x.price,0))}</td><td><button class="btn" onclick="clientModal('${c.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Os compradores cadastrados aparecem aqui.</td></tr>'}</tbody></table></div>`}
function finance(){let t=totals();document.getElementById('body').innerHTML=`<section class="metrics"><div class="metric"><small>Receita total</small><h2>${money(t.gross)}</h2></div><div class="metric"><small>Custo dos aparelhos</small><h2>${money(t.cost)}</h2></div><div class="metric"><small>Taxas + despesas</small><h2>${money(t.fees+t.expenses)}</h2></div><div class="metric"><small>Lucro estimado</small><h2>${money(t.profit)}</h2></div></section><div class="notice">A receber: <b>${money(data.sales.reduce((a,s)=>a+s.price-(s.received??s.price),0))}</b> · O lucro é calculado pelas vendas, independentemente da data de recebimento.</div><div class="sectionhead"><h2>Despesas adicionais</h2><button class="btn primary" onclick="expenseModal()">＋ Adicionar despesa</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Ação</th></tr></thead><tbody>${[...data.expenses].reverse().map(e=>`<tr><td>${dateFmt(e.date)}</td><td>${safe(e.desc)}</td><td>${money(e.value)}</td><td><button class="btn" onclick="expenseModal('${e.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma despesa adicional cadastrada.</td></tr>'}</tbody></table></div><details class="panel"><summary>Tabela de taxas da maquininha e link de pagamento</summary><div class="tablewrap">${rateTable()}</div></details><div class="sectionhead"><h2>Seus dados</h2></div><div class="panel"><p class="sub">Os registros ficam no banco de dados do servidor. Exporte backups para guardar uma cópia independente.</p><div class="exportbox"><button class="btn" onclick="exportData()">↓ Exportar backup JSON</button><label class="btn">↑ Importar backup<input style="display:none" type="file" accept="application/json" onchange="importData(event)"></label></div></div>`}
function modal(title,fields,onSubmit,extra=''){document.getElementById('modalhost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form id="entryForm"><div class="fields">${fields}</div>${extra}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>`;document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{await onSubmit(new FormData(e.target))}catch(err){console.error('Operação não concluída')}finally{btn.disabled=false}}}const inp=(name,label,type='text',req=true,value='',extra='')=>`<label>${label}<input class="input" name="${name}" type="${type}" ${req?'required':''} value="${safe(value)}" ${extra}></label>`;const sel=(name,label,opts)=>`<label>${label}<select class="input" name="${name}">${opts.map(v=>`<option value="${safe(v)}">${safe(v)}</option>`).join('')}</select></label>`;const num=(n,l,req=true)=>inp(n,l,'number',req,'','min="0" step="0.01"');function closeModal(){document.getElementById('modalhost').innerHTML=''}
function fillForm(values){const form=document.getElementById('entryForm');for(const [key,value] of Object.entries(values)){const field=form.elements.namedItem(key);if(field)field.value=value??''}}
function stockModal(id=''){
 const old=byId(id),sold=old&&data.sales.some(s=>s.stockId===id);
 modal(old?'Editar iPhone':'Cadastrar iPhone',inp('model','Modelo')+inp('storage','Armazenamento')+inp('color','Cor','text',false)+inp('battery','Saúde da bateria (%)','number',false,'','min="0" max="100"')+inp('imei','IMEI ou identificação','text',false)+sel('condition','Condição',['Seminovo','Novo','Vitrine'])+num('cost','Preço de compra (R$)')+num('ask','Preço anunciado (R$)')+inp('supplier','Fornecedor','text',false)+inp('entryDate','Data de entrada','date',true,today())+inp('notes','Observações','text',false)+sel('status','Status',sold?['Vendido']:['Disponível','Reservado']),async f=>{
  const v=Object.fromEntries(f);v.model=v.model.trim();v.storage=v.storage.trim();v.imei=v.imei.trim();
  if(!v.model||!v.storage){alert('Informe modelo e armazenamento.');return}
  if(v.imei&&data.stock.some(x=>x.id!==id&&x.imei?.trim()===v.imei)){alert('IMEI já cadastrado.');return}
  const item={...old,...v,id:old?.id||uid(),cost:+v.cost,ask:+v.ask,battery:v.battery===''?null:+v.battery};
  if(old)Object.assign(old,item);else data.stock.push(item);
  if(sold)data.sales.filter(s=>s.stockId===id).forEach(s=>{s.model=item.model+' '+item.storage;s.cost=item.cost});
  await save();closeModal();main();
 },`<p class="notice">${sold?'Aparelho vendido: corrigir modelo ou custo também atualiza a venda vinculada e o lucro. O status permanece Vendido.':'Cadastre cada aparelho separadamente.'}</p>`);
 if(old)fillForm({...old,entryDate:old.entryDate||today()});
}
function clientModal(id=''){
 const old=data.clients.find(c=>c.id===id);
 modal(old?'Editar cliente':'Cadastrar cliente',inp('name','Nome completo')+inp('phone','Telefone / WhatsApp','tel',false),async f=>{
  const v=Object.fromEntries(f);v.name=v.name.trim();if(!v.name){alert('Informe o nome.');return}
  if(old){Object.assign(old,v);data.sales.filter(s=>s.clientId===id).forEach(s=>s.client=v.name)}else data.clients.push({...v,id:uid()});
  await save();closeModal();main();
 });if(old)fillForm(old);
}
const cardPayments=['Cartão de débito','Cartão de crédito','Link de pagamento'];
const roundMoney=n=>Math.round((n+Number.EPSILON)*100)/100;
function rateFor(payment,brand,installments){if(payment==='Link de pagamento')return rates['Link de pagamento'].credit[installments-1];const table=rates[brand];return payment==='Cartão de débito'?table?.debit:table?.credit[installments-1]}
function salePreview(){const item=byId(document.getElementById('sellStock').value);if(item){fillForm({price:item.ask,cost:item.cost,cardAmount:''});paymentPreview()}}
function paymentPreview(){
 const form=document.getElementById('entryForm');if(!form?.elements.payment)return;
 const v=Object.fromEntries(new FormData(form)),isCard=cardPayments.includes(v.payment),automatic=v.feeMode==='automatic';
 document.getElementById('cardFields').hidden=!isCard;
 form.elements.cardBrand.disabled=v.payment==='Link de pagamento';
 form.elements.installments.disabled=v.payment==='Cartão de débito';
 if(v.payment==='Cartão de débito')form.elements.installments.value='1';
 const installments=+form.elements.installments.value,rate=isCard?rateFor(v.payment,v.cardBrand,installments):0;
 const cardAmount=v.cardAmount===''?+v.price:+v.cardAmount;
 form.elements.fee.readOnly=automatic;
 if(automatic)form.elements.fee.value=rate==null?'':roundMoney((isCard?cardAmount:0)*rate/100).toFixed(2);
 const fee=+form.elements.fee.value||0,price=+v.price||0;
 document.getElementById('saleEstimate').textContent=rate==null&&isCard&&automatic?'Não há taxa de débito informada para esta bandeira. Escolha crédito ou taxa manual.':`${isCard&&automatic?'Taxa '+rate.toFixed(2).replace('.',',')+'% · ':''}Taxa: ${money(fee)} · Líquido da venda: ${money(price-fee)} · Lucro bruto: ${money(price-(+v.cost||0)-fee)}${isCard?' · Cartão: '+money(cardAmount)+' em '+installments+'x (parcela aproximada '+money(cardAmount/installments)+')':''}`;
}
function saleModal(selected='',id=''){
 const old=data.sales.find(s=>s.id===id),items=data.stock.filter(s=>s.status==='Disponível'||s.id===old?.stockId);
 if(!items.length){alert('Cadastre um iPhone disponível no Estoque antes de registrar uma venda.');setPage('stock');return}
 let html=`<label class="full">iPhone vendido<select name="stockId" id="sellStock" class="input" onchange="salePreview()">${items.map(s=>`<option value="${safe(s.id)}">${safe(s.model)} • ${safe(s.storage)} • ${safe(s.imei||s.color)} • custo ${money(s.cost)}</option>`).join('')}</select></label><label class="full">Cliente<select name="clientId" class="input">${data.clients.map(c=>`<option value="${safe(c.id)}">${safe(c.name)}</option>`).join('')}<option value="__new">＋ Cadastrar comprador nesta venda</option></select></label>`;
 html+=inp('newName','Nome do novo comprador','text',false)+inp('newPhone','Telefone do novo comprador','tel',false)+inp('date','Data da venda','date',true,today())+num('price','Valor total da venda (R$)')+num('cost','Custo do aparelho (R$)')+num('received','Valor já recebido bruto (R$, vazio = integral)',false)+sel('payment','Pagamento',['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Link de pagamento','Transferência','Outro'])+sel('feeMode','Cálculo da taxa',['automatic','manual']);
 html+=`<div id="cardFields" class="full fields">${sel('cardBrand','Bandeira',['Visa','Mastercard','Elo','Amex','Hipercard'])+sel('installments','Parcelas',Array.from({length:12},(_,i)=>String(i+1)))+num('cardAmount','Valor cobrado no cartão (R$, vazio = total)',false)}</div>`;
 html+=num('fee','Taxa total descontada (R$)',false)+inp('warranty','Garantia','text',false)+inp('notes','Observações','text',false);
 modal(old?'Editar venda':'Registrar venda',html,async f=>{
  const v=Object.fromEntries(f),price=+v.price,received=v.received===''?price:+v.received,item=byId(v.stockId);
  if(!item||(item.status!=='Disponível'&&item.id!==old?.stockId)){alert('Aparelho indisponível.');return}
  if(received>price){alert('O valor recebido não pode superar a venda.');return}
  const isCard=cardPayments.includes(v.payment),installments=v.payment==='Cartão de débito'?1:+v.installments||1;
  const brand=v.payment==='Link de pagamento'?'Link de pagamento':v.cardBrand,cardAmount=isCard?(v.cardAmount===''?price:+v.cardAmount):0,rate=isCard?rateFor(v.payment,brand,installments):0;
  if(cardAmount>price){alert('O valor no cartão não pode superar a venda.');return}
  if(v.feeMode==='automatic'&&rate==null){alert('Taxa de débito não informada para esta bandeira.');return}
  let client=data.clients.find(c=>c.id===v.clientId);
  if(v.clientId==='__new'){if(!v.newName.trim()){alert('Informe o nome do comprador.');return}client={id:uid(),name:v.newName.trim(),phone:v.newPhone||''}}
  if(!client){alert('Selecione um cliente.');return}
  const fee=v.feeMode==='automatic'?roundMoney(cardAmount*rate/100):+v.fee||0;
  const sale={...old,id:old?.id||uid(),stockId:item.id,model:item.model+' '+item.storage,clientId:client.id,client:client.name,date:v.date,price,cost:+v.cost,fee,payment:v.payment,received,warranty:v.warranty,notes:v.notes,feeMode:v.feeMode,cardBrand:isCard?brand:'',installments:isCard?installments:1,cardAmount,feeRate:v.feeMode==='automatic'?rate:0};
  if(v.clientId==='__new')data.clients.push(client);
  if(old&&old.stockId!==item.id)byId(old.stockId).status='Disponível';
  item.status='Vendido';item.cost=sale.cost;
  if(old)Object.assign(old,sale);else data.sales.push(sale);
  await save();closeModal();setPage('sales');
 },'<div id="saleEstimate" class="result" aria-live="polite"></div><p class="notice">As taxas são descontadas do valor cobrado, sem acréscimo automático ao cliente. Valor no cartão permite separar entrada via Pix. Parcelas são informativas; recebimentos são registrados pelo valor bruto.</p><details><summary>Consultar tabela de taxas</summary><div id="rateTable" class="tablewrap"></div></details>');
 const form=document.getElementById('entryForm');
 form.elements.feeMode.options[0].textContent='Automático pela tabela';form.elements.feeMode.options[1].textContent='Manual em reais';
 if(old)fillForm({...old,received:old.received??old.price,feeMode:old.feeMode||'manual',cardBrand:old.cardBrand==='Link de pagamento'?'Visa':old.cardBrand||'Visa',installments:old.installments||1,cardAmount:old.cardAmount??''});
 else{fillForm({stockId:selected||items[0].id,clientId:data.clients[0]?.id||'__new',feeMode:'automatic'});salePreview()}
 form.addEventListener('input',paymentPreview);form.addEventListener('change',paymentPreview);paymentPreview();
 document.getElementById('rateTable').innerHTML=rateTable();
}
function rateTable(){return `<table class="table"><thead><tr><th>Parcelas</th>${Object.keys(rates).map(k=>`<th>${safe(k)}</th>`).join('')}</tr></thead><tbody>${['Débito',...Array.from({length:12},(_,i)=>`${i+1}x`)].map((label,i)=>`<tr><td>${label}</td>${Object.values(rates).map(t=>{const r=i===0?t.debit:t.credit[i-1];return `<td>${r==null?'Não informado':r.toFixed(2).replace('.',',')+'%'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function expenseModal(id=''){
 const old=data.expenses.find(e=>e.id===id);
 modal(old?'Editar despesa':'Adicionar despesa',inp('date','Data','date',true,today())+inp('desc','Descrição')+num('value','Valor (R$)'),async f=>{const v=Object.fromEntries(f);const item={...old,...v,id:old?.id||uid(),value:+v.value};if(old)Object.assign(old,item);else data.expenses.push(item);await save();closeModal();finance()});if(old)fillForm(old);
}

function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-pulso-iphone-'+today()+'.json';a.click();URL.revokeObjectURL(url)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=async()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.stock)||!Array.isArray(x.sales)||!Array.isArray(x.clients)||!Array.isArray(x.expenses))throw Error('formato');if(!confirm('Substituir todos os dados atuais pelo backup importado?'))return;data={stock:x.stock,sales:x.sales,clients:x.clients,expenses:x.expenses};await save();main();alert('Backup importado.')}catch(err){alert('Arquivo inválido.')}};reader.readAsText(f)}load().catch(e=>alert(e.message));
</script></body></html>
